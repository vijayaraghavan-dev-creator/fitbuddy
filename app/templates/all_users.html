<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FitBuddy - All Users & Workout Plans</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f2f4f8;
    }
    h1 { text-align: center; }
    .table-wrap {
        overflow-x: auto;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    table {
        border-collapse: collapse;
        width: 100%;
        min-width: 900px;
    }
    th {
        background-color: #2f6fed;
        color: white;
        padding: 10px;
        text-align: left;
        position: sticky;
        top: 0;
    }
    td {
        padding: 10px;
        border-bottom: 1px solid #e0e0e0;
        vertical-align: top;
        max-width: 260px;
    }
    tr:nth-child(even) { background-color: #fafbfd; }
    pre {
        white-space: pre-wrap;
        font-family: 'Roboto', sans-serif;
        font-size: 13px;
        max-height: 220px;
        overflow-y: auto;
        margin: 0;
    }
</style>
</head>
<body>
    <h1>📋 FitBuddy - All Users & Workout Plans</h1>
    <div class="table-wrap">
    <table>
        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Weight (kg)</th>
            <th>Goal</th>
            <th>Intensity</th>
            <th>Original Plan</th>
            <th>Updated Plan</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.age }}</td>
            <td>{{ user.weight }}</td>
            <td>{{ user.goal }}</td>
            <td>{{ user.intensity }}</td>
            <td><pre>{{ user.original_plan }}</pre></td>
            <td><pre>{{ user.updated_plan }}</pre></td>
        </tr>
        {% endfor %}
    </table>
    </div>
</body>
</html>
