<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FitBuddy - AI Workout Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                    url('/static/images/gym-bg.jpg') center/cover no-repeat;
    }
    .form-card {
        background: rgba(255,255,255,0.95);
        padding: 30px 35px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        width: 340px;
    }
    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
    }
    label {
        font-weight: bold;
        display: block;
        margin-top: 12px;
        margin-bottom: 4px;
    }
    input, select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        background-color: #2f6fed;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s ease-in-out;
    }
    button:hover {
        background-color: #2558c0;
    }
    @media (max-width: 400px) {
        .form-card { width: 90%; }
    }
</style>
</head>
<body>
    <div class="form-card">
        <h1>💪 FitBuddy - AI Workout Generator</h1>
        <form action="/generate-workout" method="post">
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>

            <label for="weight">Weight (kg):</label>
            <input type="number" step="0.1" id="weight" name="weight" required>

            <label for="goal">Fitness Goal:</label>
            <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, flexibility" required>

            <label for="intensity">Workout Intensity:</label>
            <select id="intensity" name="intensity">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Generate Plan</button>
        </form>
    </div>
</body>
</html>
